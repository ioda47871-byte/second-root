name: CI

# Required checks (see docs/AI_WORKFLOW.md): static, unit, integration, build, e2e, e2e-sales.
# integration runs against a throwaway local Supabase stack (Docker) with its
# well-known local keys; no hosted Supabase project is ever used here.
# No production Supabase or other production secret is ever used here.

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Only superseded PR runs are cancelled; every push to main/develop is checked.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  static:
    name: static
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:secrets

  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The design worker tests capture a local mock page with headless Chromium.
      - run: npx playwright install --with-deps chromium
      - run: npm test

  integration:
    name: integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx supabase start -x studio,imgproxy,realtime,storage-api,edge-runtime,logflare,vector,supavisor,postgres-meta,mailpit
      - run: npm run test:integration
      - if: always()
        run: npx supabase stop --no-backup

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # next/font/google downloads fonts at build time and Google occasionally
      # returns a font URL next/font cannot parse ("next-font-loader" error).
      # Retry exactly once for that specific external failure; any other
      # build error fails immediately.
      - name: npm run build
        run: |
          set -o pipefail
          if ! npm run build 2>&1 | tee build.log; then
            if grep -q "next-font-loader" build.log; then
              echo "::warning::Google Fonts fetch failed during build; retrying once"
              npm run build
            else
              exit 1
            fi
          fi
      # e2e reuses this build instead of building again: next/font/google
      # downloads fonts at build time, so every extra build is another
      # chance for a bad Google Fonts response to fail the run.
      - uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: |
            .next/
            !.next/cache/
          include-hidden-files: true
          retention-days: 1

  # Existing Second Root regression: no Supabase, so it cannot be broken by
  # anything the Sales Agent depends on.
  e2e:
    name: e2e
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .next/
      - run: npm run test:e2e:site
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-site
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Sales Agent pages (demo, admin) against a throwaway local Supabase stack.
  e2e-sales:
    name: e2e-sales
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx supabase start -x studio,imgproxy,realtime,storage-api,edge-runtime,logflare,vector,supavisor,postgres-meta,mailpit
      - uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .next/
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-sales
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - if: always()
        run: npx supabase stop --no-backup
