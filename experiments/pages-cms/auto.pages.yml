# Generated from the content model (experiments/pages-cms). Edit the model, not this file.
media:
  input: "media"
  output: "/media"
  extensions: ["jpg", "jpeg", "png", "webp", "JPG", "JPEG", "PNG", "WEBP"]
  rename: "safe"
content:
  - name: "works"
    label: "施工実績"
    type: "collection"
    path: "content/works"
    format: "json"
    filename: "{id}.json"
    view:
      fields: ["vehicle", "service", "visible"]
      primary: "vehicle"
      sort: ["displayOrder", "vehicle"]
      default:
        sort: "displayOrder"
        order: "asc"
    fields:
      - name: "id"
        label: "ID（自動）"
        type: "uuid"
        readonly: true
        hidden: true
      - name: "vehicle"
        label: "車種"
        type: "string"
        required: true
        description: "例: 架空車 ワゴン 2019年式"
        options:
          maxlength: 60
      - name: "service"
        label: "施工の種類"
        type: "string"
        required: true
        description: "例: ガラスコーティング、車内清掃"
        options:
          maxlength: 40
      - name: "description"
        label: "ひとこと説明"
        type: "text"
        options:
          maxlength: 300
      - name: "photos"
        label: "写真（1枚以上・4枚まで。試行中の上限です）"
        type: "object"
        list:
          min: 1
          max: 4
          collapsible:
            collapsed: false
            summary: "{role} {imageAlt}"
        fields:
          - name: "image"
            label: "写真"
            type: "image"
            required: true
            description: "JPEG・PNG・WebP、2MB まで、長い辺 4096px まで・1600 万画素まで・短い辺 320px 以上、縦横の比は 3:1 まで（スマートフォンの写真は「中」や「大」のサイズで送ると収まります）"
            options:
              extensions: ["jpg", "jpeg", "png", "webp", "JPG", "JPEG", "PNG", "WEBP"]
          - name: "imageAlt"
            label: "写真の説明（読み上げ用）"
            type: "string"
            options:
              maxlength: 120
          - name: "role"
            label: "施工前・施工後"
            type: "select"
            default: "other"
            description: "施工前と施工後はそれぞれ1件に1枚まで（試行中）。頁で写真に「施工前」「施工後」と出ます"
            options:
              values:
                - name: "other"
                  label: "指定なし"
                - name: "before"
                  label: "施工前"
                - name: "after"
                  label: "施工後"
      - name: "visible"
        label: "公開する"
        type: "boolean"
        default: true
      - name: "displayOrder"
        label: "並び順（小さいほど上）"
        type: "number"
        default: 0
        options:
          min: 0
          max: 9999
  - name: "shop"
    label: "営業時間・臨時休業"
    type: "file"
    path: "content/shop.json"
    format: "json"
    operations:
      delete: false
    fields:
      - name: "name"
        label: "店名（変更できません）"
        type: "string"
        readonly: true
      - name: "address"
        label: "住所"
        type: "string"
        pattern:
          regex: "^(?![\\s\\S]*([Hh][Tt][Tt][Pp][Ss]?:|[Ww][Ww][Ww]\\.|:\\/\\/))[^<>]{0,120}$"
          message: "住所は 120 字まで。記号 < > とリンク（http・www）は書けません。前後の空白は保存されたまま残り、構築のときに除きます"
        options:
          maxlength: 120
      - name: "phone"
        label: "電話"
        type: "string"
        pattern:
          regex: "^([+＋]?[0-9０-９()（）\\-－ 　]{10,24})?$"
          message: "例: 03-1234-5678（数字・ハイフン・括弧。全角の数字も使えます。空なら表示しません）"
        options:
          maxlength: 24
      - name: "hours"
        label: "営業時間（曜日ごと）"
        type: "object"
        list:
          max: 7
          collapsible:
            collapsed: true
            summary: "{day} {open}–{close}"
        fields:
          - name: "day"
            label: "曜日"
            type: "select"
            required: true
            options:
              values:
                - name: "mon"
                  label: "月"
                - name: "tue"
                  label: "火"
                - name: "wed"
                  label: "水"
                - name: "thu"
                  label: "木"
                - name: "fri"
                  label: "金"
                - name: "sat"
                  label: "土"
                - name: "sun"
                  label: "日"
          - name: "closed"
            label: "定休日"
            type: "boolean"
            default: false
          - name: "open"
            label: "開店"
            type: "string"
            pattern:
              regex: "^(([01][0-9]|2[0-3]):[0-5][0-9])?$"
              message: "08:30 のように 24 時間で書きます（空なら表示しません）"
          - name: "close"
            label: "閉店"
            type: "string"
            pattern:
              regex: "^(([01][0-9]|2[0-3]):[0-5][0-9])?$"
              message: "08:30 のように 24 時間で書きます（空なら表示しません）"
      - name: "hoursNote"
        label: "営業時間の補足"
        type: "string"
        options:
          maxlength: 120
      - name: "specialClosures"
        label: "臨時休業"
        type: "object"
        list:
          max: 60
          collapsible:
            collapsed: true
            summary: "{date} {note}"
        fields:
          - name: "date"
            label: "日付"
            type: "date"
            required: true
            options:
              format: "yyyy-MM-dd"
          - name: "note"
            label: "理由など"
            type: "string"
            options:
              maxlength: 80
  - name: "news"
    label: "お知らせ"
    type: "collection"
    path: "content/news"
    format: "json"
    filename: "{id}.json"
    view:
      fields: ["title", "publishedAt", "visible"]
      primary: "title"
      sort: ["publishedAt"]
      default:
        sort: "publishedAt"
        order: "desc"
    fields:
      - name: "id"
        label: "ID（自動）"
        type: "uuid"
        readonly: true
        hidden: true
      - name: "title"
        label: "見出し"
        type: "string"
        required: true
        options:
          maxlength: 80
      - name: "body"
        label: "本文"
        type: "text"
        options:
          maxlength: 1000
      - name: "publishedAt"
        label: "日付"
        type: "date"
        required: true
        options:
          format: "yyyy-MM-dd"
      - name: "visible"
        label: "公開する"
        type: "boolean"
        default: true
