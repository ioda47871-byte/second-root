<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>架空菓庵｜架空店舗のデザイン提案</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="masthead" id="top" data-comp-section="header">
  <div class="masthead-inner" data-comp-container>
    <p class="masthead-name" data-comp-type="label">架空菓庵</p>
    <nav class="masthead-nav" data-comp-nav>
      <ul class="masthead-links">
        <li><a href="#products" data-comp-type="label">商品・こだわり</a></li>
        <li><a href="#info" data-comp-type="label">店舗情報</a></li>
      </ul>
    </nav>
  </div>
</header>
<main>
  <section class="lead" id="hero" data-comp-section="hero">
    <div class="lead-inner" data-comp-container>
      <div class="lead-visual" data-comp-slot="hero-visual" data-comp-placeholder>
        <span class="lead-visual-disc"></span>
      </div>
      <div class="lead-copy">
        <h1 class="lead-name" data-comp-type="display">架空菓庵</h1>
        <hr class="lead-rule">
        <p class="lead-text" data-comp-type="body">季節の上生菓子と、毎朝炊く粒あんのどら焼き</p>
        <a class="lead-cta" href="#info" data-comp-cta data-comp-type="label">店舗情報を見る</a>
      </div>
    </div>
  </section>
  <section class="goods" id="products" data-comp-section="products">
    <div class="goods-inner" data-comp-container>
      <h2 class="goods-title" data-comp-type="heading">商品・こだわり</h2>
      <ul class="goods-row">
        <li class="goods-card">
          <div class="goods-visual goods-visual-a" data-comp-slot="card-namagashi" data-comp-placeholder></div>
          <p class="goods-caption" data-comp-type="caption">季節の上生菓子</p>
        </li>
        <li class="goods-card">
          <div class="goods-visual goods-visual-b" data-comp-slot="card-dorayaki" data-comp-placeholder></div>
          <p class="goods-caption" data-comp-type="caption">粒あんのどら焼き</p>
        </li>
        <li class="goods-card">
          <div class="goods-visual goods-visual-c" data-comp-slot="card-macro" data-comp-placeholder></div>
        </li>
      </ul>
      <p class="goods-copy" data-comp-type="body">比較用の架空の和菓子屋です。実在の店舗ではありません。季節の上生菓子と、毎朝炊く粒あんのどら焼きを、小さな店頭で一つずつお包みしています。</p>
    </div>
  </section>
  <section class="facts" id="info" data-comp-section="info">
    <div class="facts-inner" data-comp-container>
      <h2 class="facts-title" data-comp-type="heading">店舗情報</h2>
      <dl class="facts-list">
        <div class="facts-row"><dt data-comp-type="label">営業時間</dt><dd data-comp-type="body">9:00〜18:00（売り切れ次第終了）</dd></div>
        <div class="facts-row"><dt data-comp-type="label">定休日</dt><dd data-comp-type="body">水曜・第2火曜</dd></div>
        <div class="facts-row"><dt data-comp-type="label">住所</dt><dd data-comp-type="body">名古屋市東区テスト町一丁目2-3</dd></div>
        <div class="facts-row"><dt data-comp-type="label">アクセス</dt><dd data-comp-type="body">テスト線テスト駅 1番出口から徒歩4分</dd></div>
        <div class="facts-row"><dt data-comp-type="label">電話</dt><dd data-comp-type="body">052-000-0731</dd></div>
      </dl>
    </div>
  </section>
</main>
<footer class="colophon" data-comp-section="footer">
  <div class="colophon-inner" data-comp-container>
    <p class="colophon-name" data-comp-type="label">架空菓庵</p>
    <p class="colophon-note" data-comp-disclosure>架空店舗のデザイン提案</p>
  </div>
</footer>
</body>
</html>
